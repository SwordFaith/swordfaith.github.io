name: Scheduled Deploy

# Weekly rebuild so the About page picks up fresh GitHub stats without committing them.
# Kept separate from deploy.yml because GitHub disables a scheduled workflow after 60 days
# without repository activity; only this caller gets disabled, never push/PR checks.
# Re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: '23 3 * * 1'

# No concurrency here: deploy.yml already puts scheduled runs in the 'pages' group, and
# declaring the same group in the caller would deadlock with the called workflow.

jobs:
  deploy:
    # Upper bound for the called jobs; each job in deploy.yml narrows its own permissions
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
