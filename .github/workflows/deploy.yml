name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [ main ]
  # Checks only (lint, typecheck, tests, build); never deploys
  pull_request:
    branches: [ main ]
  # Called by scheduled-deploy.yml for the weekly rebuild. The cron lives there because
  # GitHub disables a scheduled workflow (all of its triggers) after 60 days without
  # repository activity; keeping it separate means only the weekly caller can be disabled.
  # In a called workflow github.event_name is the caller's event ('schedule').
  workflow_call:
  # Allow manual runs
  workflow_dispatch:

# No default token permissions; each job requests only what it needs
permissions: {}

# Pull requests: one run per PR, superseded runs are cancelled.
# Deploys (push/schedule/dispatch): one at a time, never cancel an in-progress deploy.
# The scheduled caller must not declare the 'pages' group itself (caller/called deadlock).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scheduled runs build the current tip of main, not the event SHA, so re-running
          # an old scheduled run cannot roll the site back. Other events keep the default ('').
          ref: ${{ github.event_name == 'schedule' && github.ref || '' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      # Deploy path only (PR checks build from the committed JSON to stay deterministic).
      # Best-effort: the refreshed file is used for this build only and never committed.
      # On a missing token, sync failure (the script exits non-zero if any sub-request
      # failed), timeout, or invalid output, fall back to the committed JSON and emit a
      # warning annotation so the deploy still goes through. The timeout keeps a slow API
      # from holding the shared 'pages' concurrency slot.
      - name: Refresh GitHub stats (best-effort)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_USERNAME: ${{ vars._GITHUB_USERNAME || 'SwordFaith' }}
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          STATS_FILE: src/data/github-stats.json
        run: |
          # Fails unless the file parses and every field GitHubStats.astro renders has the right type
          validate() {
            node -e '
              const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const num = (v) => typeof v === "number" && Number.isFinite(v);
              const str = (v) => typeof v === "string";
              const s = d.summary || {};
              const a = d.recentActivity?.thisYear || {};
              const ok = str(d.lastUpdate) && str(d.user?.html_url)
                && [s.totalStars, s.totalRepos, s.totalForks, s.activeYears,
                    a.estimatedCommits, a.monthlyAverage, a.weeklyAverage].every(num)
                && typeof d.languageStats === "object" && d.languageStats !== null
                && Object.values(d.languageStats).every((l) => num(l?.percentage))
                && Array.isArray(d.topRepositories)
                && Array.isArray(d.pinnedRepositoriesData)
                && d.pinnedRepositoriesData.every((r) => str(r?.full_name) && num(r.stargazers_count) && num(r.forks_count));
              if (!ok) throw new Error("unexpected data shape");
              console.log("GitHub stats lastUpdate: " + d.lastUpdate);
            ' "$STATS_FILE"
          }

          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning title=GitHub stats not refreshed::Secret _GITHUB_TOKEN is not set; using committed $STATS_FILE"
          elif ! timeout 120 npm run sync:github:daily || ! validate; then
            echo "::warning title=GitHub stats not refreshed::Sync failed, timed out, or produced invalid data (see log); using committed $STATS_FILE"
            git checkout -- "$STATS_FILE"
          fi

          # Whatever is in place now must be valid, otherwise fail before building
          validate

      - name: Build with Astro
        run: npm run build
        env:
          NODE_ENV: production
          # Site config from repository Variables (read by src/utils/site-config.ts)
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
