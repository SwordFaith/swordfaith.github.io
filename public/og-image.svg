      <text x="24" y="55" fill="#7dd3fc" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">LANGUAGE MODEL</text>
      <g transform="translate(188 21)" fill="#67e8f9">
        <circle cx="0" cy="0" r="4"/><circle cx="0" cy="17" r="4"/><circle cx="0" cy="34" r="4"/>
        <circle cx="40" cy="0" r="4"/><circle cx="40" cy="17" r="4"/><circle cx="40" cy="34" r="4"/>
        <path d="M5 0H35M5 17H35M5 34H35M5 2L35 15M5 19L35 32M5 15L35 2M5 32L35 19" fill="none" stroke="#67e8f9" stroke-opacity="0.42"/>
      </g>
    </g>
    <g transform="translate(805 418)">
      <rect width="206" height="54" rx="12" fill="#191f3b" stroke="#6366f1" stroke-opacity="0.75"/>
      <path d="M22 29l6 6 12-16" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="33" fill="#e0e7ff" font-size="17" font-weight="600">Reward</text>
      <text x="181" y="33" text-anchor="end" fill="#818cf8" font-family="SFMono-Regular, Consolas, monospace" font-size="13">r</text>
