<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SwordFaith — LLM and RL engineering notes</title>
  <desc id="desc">A dark technical card with a policy optimization loop and notes about LLM post-training and reinforcement learning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.58">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#334155" stroke-opacity="0.55"/>
  <path d="M24 112V48a24 24 0 0 1 24-24h64" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <path d="M1088 606h64a24 24 0 0 0 24-24v-64" fill="none" stroke="#818cf8" stroke-width="3"/>

  <g transform="translate(88 70)">
    <rect width="42" height="42" rx="12" fill="#0e7490" fill-opacity="0.24" stroke="#22d3ee" stroke-opacity="0.65"/>
    <path d="M11 13h20M11 21h13M11 29h20" fill="none" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
