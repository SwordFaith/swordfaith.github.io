  </g>
  <text x="743" y="135" fill="#71859e" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">ALIGNMENT LOOP</text>
  <circle cx="1069" cy="129" r="4" fill="#22d3ee"/>
  <circle cx="1053" cy="129" r="4" fill="#475569"/>
  <circle cx="1037" cy="129" r="4" fill="#475569"/>

  <path d="M908 207V238" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M980 322C1015 352 1011 393 972 418" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M837 423C792 392 790 336 830 303" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>

