    <text x="58" y="18" fill="#e2e8f0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.5">SWORDFAITH</text>
    <text x="58" y="39" fill="#7d91aa" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">ENGINEERING NOTES</text>
  </g>

  <text x="88" y="248" fill="#f8fafc" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="750" letter-spacing="-4">LLM <tspan fill="#67e8f9">×</tspan> RL</text>
  <rect x="91" y="278" width="84" height="4" rx="2" fill="url(#accent)"/>
  <text x="88" y="329" fill="#c3d0df" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="450">Post-training &amp; reinforcement learning</text>
  <text x="88" y="369" fill="#8295ac" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25">Algorithms, frameworks and data.</text>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5">
    <g transform="translate(88 463)">
      <rect width="88" height="38" rx="19" fill="#0f2b3d" stroke="#155e75"/>
      <text x="44" y="25" text-anchor="middle" fill="#a5f3fc">RLHF</text>
